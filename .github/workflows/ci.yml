name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "claude/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace Castle.xcworkspace \
            -scheme Castle

      - name: Build (generic iOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Castle.xcworkspace \
            -scheme Castle \
            -destination "generic/platform=iOS" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean build

  test-packages:
    name: Test ${{ matrix.package }} (swift test)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [Core, Domain, Data]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: swift --version

      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test --parallel
